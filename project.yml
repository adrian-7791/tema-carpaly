name: CarThemes
options:
  bundleIdPrefix: com.carthemes.mine
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CarThemes:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Car Themes
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: Salvez wallpaper-ul in Poze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carthemes.mine.app
    dependencies:
      - target: CarWidget
  CarWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Car Theme Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carthemes.mine.app.widget
